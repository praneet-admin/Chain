<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css?v=9"></head>
<body>
<header>
  <h1>Recipe card</h1>
  <div class="switch" role="radiogroup" aria-label="Version">
    <button type="button" role="radio" aria-checked="true" data-mode="broken">Broken</button>
    <button type="button" role="radio" aria-checked="false" data-mode="fixed">Fixed</button>
  </div>
</header>
<main>
  <p class="hint" id="hint"></p>

  <section>
    <h2>Order</h2>
    <div id="picks"></div>
  </section>

  <section class="card">
    <img id="photo" alt="" width="120" height="120">
    <div class="card-text">
      <h2 id="title">Nothing ordered yet</h2>
      <div class="panel" id="meal"><h3>Meal <span>waits for the order</span></h3><p class="body"></p><p class="who"></p></div>
      <div class="panel" id="area"><h3>Cuisine <span>runs with ingredient</span></h3><p class="body"></p><p class="who"></p></div>
      <div class="panel" id="ingredient"><h3>Main ingredient <span>runs with cuisine</span></h3><p class="body"></p><p class="who"></p></div>
    </div>
  </section>

  <section class="board">
    <p id="verdict" hidden></p>
    <h2>Requests <button id="reset" type="button">Clear</button></h2>
    <div id="track"></div>
  </section>
</main>
<script src="app.js?v=9"></script>
</body></html>
